; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:onboard]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = 
	file://../shared_dynamometer
	adafruit/Adafruit Unified Sensor @ ^1.1.9
	adafruit/Adafruit LSM6DS @ ^4.7.2
	adafruit/Adafruit LIS331 @ ^1.0.6
	sparkfun/SparkFun BMP581 Arduino Library @ ^1.0.2
	sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library @ ^1.0.6
	robtillaart/ADS1X15 @ ^0.6.2
	adafruit/Adafruit MAX31856 library @ ^1.2.8
	mikalhart/TinyGPSPlus @ ^1.1.0
	marzogh/SPIMemory @ ^3.4.0
	greiman/SdFat @ ^2.3.1
	fastled/FastLED @ ^3.10.3
	robtillaart/MCP23017@^0.9.3
    madhephaestus/ESP32Servo @ ^3.0.0
monitor_speed = 115200
